<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffdf00">
  <meta name="description" content="Трохи райфового настрою: позитивні передбачення, усмішки та слова відомих українців.">
  <title>Твоє райфове передбачення ✨</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="page">
    <header><a class="wordmark" href="./" aria-label="На головну">райф<span class="brand-star" aria-hidden="true">✳</span></a><span class="header-note">трохи магії для тебе</span></header>
    <main>
      <div class="eyebrow"><span aria-hidden="true">✦</span> ХОРОШЕ ВЖЕ НА ПІДХОДІ</div>
      <h1>Твоє райфове<br>передбачення <span aria-hidden="true">✨</span></h1>
      <p class="intro">Єнотик має для тебе дещо хороше.</p>
      <div class="mascot"><img class="raccoon" src="./raccoon.jpg" width="1280" height="853" alt="Кумедний єнотик у чорному худі тримає сяючу кулю з передбаченнями" fetchpriority="high" decoding="async"></div>
      <section class="fortune-card" aria-label="Твоє передбачення">
        <div class="card-top"><span id="kind">ПОСЛАННЯ ВІД ЄНОТИКА</span><span aria-hidden="true">✦</span></div>
        <div id="result" aria-live="polite" aria-atomic="true">
          <p id="fortune">Твоя порція хорошого настрою вже тут. Відкриємо?</p>
          <p id="attribution" hidden></p>
        </div>
        <span class="card-decoration" aria-hidden="true">✧</span>
      </section>
      <button id="predict" type="button"><span id="button-label">Отримати передбачення</span><span aria-hidden="true">✨</span></button>
      <p class="hint">Маленький клік. Велика усмішка.</p>
      <noscript><p class="noscript">Увімкни JavaScript, щоб єнотик міг обирати передбачення.</p></noscript>
    </main>
    <footer><span>З теплом і трішки з єнотиком 🖤</span><span class="footer-note">Для настрою. Неофіційний творчий проєкт.</span></footer>
  </div>
</body>
</html>
